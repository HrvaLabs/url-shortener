<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/email :: layout(title=${subject}, heading='More custom domains approved', preheader=~{::preheader}, content=~{::content}, footer=~{})}">
<body>
<th:block th:fragment="preheader">Your account can now have <th:block th:text="${limit}">3</th:block> custom domains.</th:block>
<th:block th:fragment="content">
  <p class="e-fg" th:style="${s.p}">Hi <strong class="e-fg" th:style="${s.strong}" th:text="${name}">alice@example.com</strong>,</p>
  <p class="e-fg" th:style="${s.p}">We approved your request. Your account can now have <strong class="e-fg" th:style="${s.strong}" th:text="${limit}">3</strong> custom domains.</p>
  <p class="e-fg" th:if="${note != null}" th:style="${s.p}">Note from the admin: <span th:text="${note}">Fine for your shops</span></p>
  <th:block th:replace="~{fragments/email :: button(${settings_url}, 'Open Custom domains')}"/>
</th:block>
</body>
</html>
