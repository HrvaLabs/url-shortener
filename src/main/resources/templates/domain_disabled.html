<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/email :: layout(title=${subject}, heading='Domain turned off', preheader=~{::preheader}, content=~{::content}, footer=~{})}">
<body>
<th:block th:fragment="preheader">We turned off <th:block th:text="${hostname}">go.example.com</th:block>. Its links stop working until it's turned back on.</th:block>
<th:block th:fragment="content">
  <p class="e-fg" th:style="${s.p}">Hi <strong class="e-fg" th:style="${s.strong}" th:text="${name}">alice@example.com</strong>,</p>
  <p class="e-fg" th:style="${s.p}">We turned off <span class="e-fg mono" th:style="${s.short} + ${wrap}" th:text="${hostname}">go.example.com</span>. Its links stop working until it's turned back on.</p>
  <table class="e-bd" th:if="${reason_text != null}" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" th:style="${s.panel}">
    <tr>
      <td class="e-fg" th:style="${s.row}"><div class="e-mu" th:style="${s.label}">Reason</div>
          <span th:text="${reason_text}">Phishing kit</span></td>
    </tr>
  </table>
  <p class="e-fg" th:style="${s.p}">If you think that's a mistake, contact <a class="e-lk" th:href="@{'mailto:' + ${contact_email}}" th:style="${s.link}" th:text="${contact_email}">support@hrva.cc</a>.</p>
  <th:block th:replace="~{fragments/email :: signoff}"/>
</th:block>
</body>
</html>
