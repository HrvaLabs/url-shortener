<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/email :: layout(title='Link expiring soon', heading='Link expiring soon', preheader=~{::preheader}, content=~{::content}, footer=~{fragments/email :: consent('You get this because you turned on expiry reminders.', 'Turn off expiry reminders')})}">
<body>
<th:block th:fragment="preheader">Your link <th:block th:text="${short_link}">hrva.cc/abc</th:block> expires on <th:block th:text="${expirationDate}">28 October 2026 at 14:05 UTC</th:block>. Extend it from your dashboard.</th:block>
<th:block th:fragment="content">
  <p class="e-fg" th:style="${s.p}">Hi <strong class="e-fg" th:style="${s.strong}" th:text="${name}">alice@example.com</strong>,</p>
  <p class="e-fg" th:style="${s.p}">Your link <span class="e-fg mono" th:style="${s.short}"><th:block th:text="${short_link}">hrva.cc/abc</th:block></span> expires on <strong class="e-fg" th:style="${s.strong}" th:text="${expirationDate}">28 October 2026 at 14:05 UTC</strong>.</p>
  <table class="e-bd" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" th:style="${s.panel}">
    <tr>
      <td class="e-fg" th:style="${s.row}"><div class="e-mu" th:style="${s.label}">Destination</div>
          <span th:text="${longUrl}">https://example.com/page</span></td>
    </tr>
  </table>
  <p class="e-fg" th:style="${s.p}">Sign in to extend it.</p>
  <th:block th:replace="~{fragments/email :: button(@{${dashboard_page}}, 'Go to dashboard')}"/>
</th:block>
</body>
</html>
