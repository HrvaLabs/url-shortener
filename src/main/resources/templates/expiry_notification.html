<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <title>Short link expiring soon</title>
  <style type="text/css">
    body, table, td, p, a, li, blockquote {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    table, td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
    table {
      border-collapse: collapse !important;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100% !important;
      height: 100% !important;
    }
    @media only screen and (max-width: 600px) {
      .container { width: 100% !important; }
      .content { padding: 24px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #0a0a0a; font-family: 'Georgia', 'Times New Roman', serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #0a0a0a;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table class="container" role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="max-width: 560px;">
          <!-- Header -->
          <tr>
            <td align="center" style="padding: 32px 20px 24px; background-color: #0f0f0f; border-radius: 12px 12px 0 0; border: 1px solid #1a1a1a; border-bottom: none;">
              <h1 style="margin: 0; font-family: 'Georgia', 'Times New Roman', serif; font-size: 22px; font-weight: 400; color: #a67c00;">Link expiring soon</h1>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td class="content" style="padding: 36px 32px; background-color: #0f0f0f; border-left: 1px solid #1a1a1a; border-right: 1px solid #1a1a1a;">
              <p style="margin: 0 0 16px; font-family: 'Helvetica', 'Arial', sans-serif; font-size: 15px; line-height: 1.7; color: #d4d4d4;">
                Hi <strong style="color: #e8e8e8;"><span th:text="${name}"/></strong>,
              </p>
              <p style="margin: 0 0 16px; font-family: 'Helvetica', 'Arial', sans-serif; font-size: 15px; line-height: 1.7; color: #d4d4d4;">
                Your short link <code style="font-size: 14px; color: #a67c00; background: #1a1a1a; padding: 2px 8px; border-radius: 4px;">/<span th:text="${shortUrl}"/></code> is expiring on <strong style="color: #e8e8e8;" th:text="${expirationDate}"/>.
              </p>
              <p style="margin: 0 0 4px; font-family: 'Helvetica', 'Arial', sans-serif; font-size: 13px; line-height: 1.6; color: #666;">
                Destination: <span style="color: #999;" th:text="${longUrl}"/>
              </p>
              <p style="margin: 0 0 24px; font-family: 'Helvetica', 'Arial', sans-serif; font-size: 15px; line-height: 1.7; color: #d4d4d4;">
                Log in to your dashboard to extend it.
              </p>

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td align="center" style="padding: 4px 0;">
                    <a th:href="@{${login_page}}" target="_blank"
                       style="display: inline-block; padding: 13px 36px; font-family: 'Helvetica', 'Arial', sans-serif; font-size: 14px; font-weight: 600; color: #0a0a0a; text-decoration: none; background-color: #a67c00; border-radius: 8px;">
                      Go to Dashboard
                    </a>
                  </td>
                </tr>
              </table>

              <hr style="border: none; border-top: 1px solid #1a1a1a; margin: 28px 0 24px;">

              <p style="margin: 0; font-family: 'Helvetica', 'Arial', sans-serif; font-size: 13px; line-height: 1.6; color: #666;">
                Best regards,<br>
                <span style="color: #a67c00;" th:text="${app_name}"/> team
              </p>

              <hr style="border: none; border-top: 1px solid #1a1a1a; margin: 24px 0 16px;">

              <p style="margin: 0 0 8px; font-family: 'Helvetica', 'Arial', sans-serif; font-size: 12px; line-height: 1.6; color: #666;">
                You get this because you turned on expiry reminders.
              </p>
              <p style="margin: 0; font-family: 'Helvetica', 'Arial', sans-serif; font-size: 12px; line-height: 1.6; color: #666;">
                <a th:href="${unsubscribe_page}" target="_blank" style="color: #999; text-decoration: underline;">Turn off expiry reminders</a>
                &nbsp;&middot;&nbsp;
                <a th:href="${settings_page}" target="_blank" style="color: #999; text-decoration: underline;">Notification settings</a>
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td align="center" style="padding: 20px 32px; background-color: #0a0a0a; border: 1px solid #1a1a1a; border-top: none; border-radius: 0 0 12px 12px;">
              <p style="margin: 0; font-family: 'Helvetica', 'Arial', sans-serif; font-size: 12px; color: #444;">
                <span th:text="${app_name}"/> &nbsp;&copy;&nbsp; All Rights Reserved
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
