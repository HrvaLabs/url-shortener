<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/email :: layout(title=${headline}, heading=${headline}, preheader=~{::preheader}, content=~{::content}, footer=~{})}">
<body>
<th:block th:fragment="preheader">Clicks, new links, users, reviews and blocks for the week.</th:block>
<th:block th:fragment="content">
  <table class="e-bd" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" th:style="${s.panel}">
    <tr th:each="line, it : ${summary}">
      <td class="e-fg e-bd" th:style="${it.first} ? ${s.row} : ${s.rowNext}"><span th:text="${line.text}">Clicks: 1,204</span><th:block th:if="${line.link != null}"> <a class="e-lk" th:href="${line.link}" th:text="${line.link}" target="_blank" th:style="${s.link}">https://app.hrva.cc/admin/review</a></th:block></td>
    </tr>
    <tr th:each="line : ${top_links}">
      <td class="e-fg e-bd" th:style="${s.rowNext}" th:text="${line}">1. hrva.cc/my_menu &rarr; example.com, 120 clicks</td>
    </tr>
  </table>
  <th:block th:replace="~{fragments/email :: button(${stats_page}, 'Open stats (last 7 days)')}"/>
</th:block>
</body>
</html>
