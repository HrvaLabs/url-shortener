<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/email :: layout(title=${headline}, heading=${headline}, preheader=~{::preheader}, content=~{::content}, footer=~{fragments/email :: consent('You get this because you turned on the weekly summary.', 'Turn off the weekly summary')})}">
<body>
<th:block th:fragment="preheader">Your clicks for the week, your busiest links and anything that needs a look.</th:block>
<th:block th:fragment="content">
  <th:block th:if="${not #lists.isEmpty(clicks)}">
    <h2 class="e-fg" th:style="${s.h2} + 'margin-top: 0;'" th:text="'Clicks'">Clicks</h2>
    <table class="e-bd" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" th:style="${s.panel}">
      <tr th:each="line, it : ${clicks}">
        <td class="e-fg e-bd" th:style="${it.first} ? ${s.row} : ${s.rowNext}" th:text="${line}">Clicks: 210</td>
      </tr>
    </table>
  </th:block>
  <th:block th:if="${not #lists.isEmpty(top_links)}">
    <h2 class="e-fg" th:style="${s.h2}" th:text="${top_links_heading}">Top links</h2>
    <table class="e-bd" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" th:style="${s.panel}">
      <tr th:each="line, it : ${top_links}">
        <td class="e-fg e-bd" th:style="${it.first} ? ${s.row} : ${s.rowNext}" th:text="${line}">1. hrva.cc/abc &rarr; example.com, 90 clicks</td>
      </tr>
    </table>
  </th:block>
  <th:block th:if="${not #lists.isEmpty(dead_links)}">
    <h2 class="e-fg" th:style="${s.h2}" th:text="${dead_links_heading}">Links that stopped working</h2>
    <table class="e-bd" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" th:style="${s.panel}">
      <tr th:each="line, it : ${dead_links}">
        <td class="e-fg e-bd" th:style="${it.first} ? ${s.row} : ${s.rowNext}" th:text="${line}">hrva.cc/dead &rarr; example.net</td>
      </tr>
      <tr th:if="${dead_links_more != null}">
        <td class="e-mu e-bd" th:style="${s.rowNext} + 'color: #67676f;'" th:text="${dead_links_more}">and 4 more</td>
      </tr>
    </table>
  </th:block>
  <th:block th:if="${not #lists.isEmpty(ending_soon)}">
    <h2 class="e-fg" th:style="${s.h2}" th:text="${ending_soon_heading}">Ending soon</h2>
    <table class="e-bd" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" th:style="${s.panel}">
      <tr th:each="line, it : ${ending_soon}">
        <td class="e-fg e-bd" th:style="${it.first} ? ${s.row} : ${s.rowNext}" th:text="${line}">hrva.cc/soon &rarr; example.org</td>
      </tr>
      <tr th:if="${ending_soon_more != null}">
        <td class="e-mu e-bd" th:style="${s.rowNext} + 'color: #67676f;'" th:text="${ending_soon_more}">and 1 more</td>
      </tr>
    </table>
  </th:block>
  <th:block th:replace="~{fragments/email :: button(${dashboard_url}, 'Open your links')}"/>
</th:block>
</body>
</html>
