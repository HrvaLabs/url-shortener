<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/email :: layout(title='Account deactivated', heading='Account deactivated', preheader=~{::preheader}, content=~{::content}, footer=~{})}">
<body>
<th:block th:fragment="preheader">Your account was deactivated after <th:block th:text="${days_of_inactivity}">180</th:block> days of inactivity. Contact us to reinstate it.</th:block>
<th:block th:fragment="content">
  <p class="e-fg" th:style="${s.p}">Hello <strong class="e-fg" th:style="${s.strong}" th:text="${name}">alice@example.com</strong>,</p>
  <p class="e-fg" th:style="${s.p}">Your account has been deactivated after <strong class="e-fg" th:style="${s.strong}" th:text="${days_of_inactivity}">180</strong> days of inactivity. We do this to protect your account security.</p>
  <p class="e-fg" th:style="${s.p}">If you'd like to reinstate your account, please <a class="e-lk" th:href="'mailto:' + ${contact_email}" th:style="${s.link}">contact us</a>.</p>
  <th:block th:replace="~{fragments/email :: signoff}"/>
</th:block>
</body>
</html>
