<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/email :: layout(title='Account deactivated', heading='Account deactivated', preheader=~{::preheader}, content=~{::content}, footer=~{})}">
<body>
<th:block th:fragment="preheader">Your account was deactivated after <th:block th:text="${inactivity_period}">5 years</th:block> without use. Email <th:block th:text="${contact_email}">support@hrva.cc</th:block> to get it back.</th:block>
<th:block th:fragment="content">
  <p class="e-fg" th:style="${s.p}">Hi <strong class="e-fg" th:style="${s.strong}" th:text="${name}">alice@example.com</strong>,</p>
  <p class="e-fg" th:style="${s.p}">Your account has been deactivated after <strong class="e-fg" th:style="${s.strong}" th:text="${inactivity_period}">5 years</strong> without use. To get it back, email <a class="e-lk" th:href="@{'mailto:' + ${contact_email}}" th:style="${s.link}" th:text="${contact_email}">support@hrva.cc</a>.</p>
</th:block>
</body>
</html>
