<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/email :: layout(title=${subject}, heading='Domain not approved', preheader=~{::preheader}, content=~{::content}, footer=~{})}">
<body>
<th:block th:fragment="preheader">We didn't approve <th:block th:text="${hostname}">go.example.com</th:block>.</th:block>
<th:block th:fragment="content">
  <p class="e-fg" th:style="${s.p}">Hi <strong class="e-fg" th:style="${s.strong}" th:text="${name}">alice@example.com</strong>,</p>
  <p class="e-fg" th:style="${s.p}">We didn't approve <span class="e-fg mono" th:style="${s.short} + ${wrap}" th:text="${hostname}">go.example.com</span>.</p>
  <p class="e-fg" th:if="${note != null}" th:style="${s.p}">Note from the admin: <span th:text="${note}">Use a domain you own</span></p>
  <p class="e-fg" th:style="${s.p}">If you think that's a mistake, contact <a class="e-lk" th:href="@{'mailto:' + ${contact_email}}" th:style="${s.link}" th:text="${contact_email}">support@hrva.cc</a>.</p>
  <th:block th:replace="~{fragments/email :: signoff}"/>
</th:block>
</body>
</html>
