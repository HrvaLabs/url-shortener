<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>This link was made without an account &middot; hrva.cc</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 40px 16px; background-color: #f4f4f5; color: #0e0e11; font-family: Host Grotesk, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
    main { max-width: 600px; margin: 0 auto; }
    .brand { margin: 0 0 20px; padding: 0 33px; font-size: 14px; line-height: 22px; font-weight: 600; }
    .home { color: #67676f; text-decoration: none; }
    .card { padding: 40px 32px 36px; background-color: #ffffff; border: 1px solid #e4e4e7; border-radius: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04); }
    h1 { margin: 0 0 20px; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.02em; }
    .destination { margin: 0 0 24px; padding: 12px 16px; font-family: JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace; font-size: 14px; line-height: 22px; background-color: #f4f4f5; border: 1px solid #e4e4e7; border-radius: 10px; word-break: break-word; }
    .actions { margin: 0 0 16px; }
    .continue { display: inline-block; max-width: 100%; box-sizing: border-box; padding: 12px 24px; font-size: 15px; line-height: 20px; font-weight: 600; color: #ffffff; background-color: #0e0e11; border-radius: 10px; text-decoration: none; overflow-wrap: anywhere; }
    .report { font-size: 14px; line-height: 22px; color: #2453ff; text-decoration: underline; text-underline-offset: 3px; }
    @media (max-width: 520px) {
      body { padding: 24px 12px; }
      .brand { padding: 0 20px; }
      .card { padding: 28px 20px 24px; }
      h1 { font-size: 22px; line-height: 28px; }
      .continue { display: block; text-align: center; }
    }
    @media (prefers-color-scheme: dark) {
      body { background-color: #09090b; color: #f5f5f5; }
      .home { color: #a1a1aa; }
      .card { background-color: #161618; border-color: #2a2a2d; }
      .destination { background-color: #202022; border-color: #2a2a2d; }
      .continue { background-color: #f5f5f5; color: #131316; }
      .report { color: #708fff; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand"><a th:href="${homeUrl}" class="home">hrva.cc</a></p>
    <div class="card">
      <h1>This link was made without an account. It goes to:</h1>
      <p class="destination" style="overflow-wrap:anywhere" th:text="${destination}">https://example.com</p>
      <p class="actions"><a th:href="${location}" rel="nofollow" class="continue" th:text="'Continue to ' + ${host}">Continue to example.com</a></p>
      <p><a th:href="${reportUrl}" class="report">Report this link</a></p>
    </div>
  </main>
</body>
</html>
