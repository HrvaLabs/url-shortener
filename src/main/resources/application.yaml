spring:
  liquibase:
    change-log: classpath:/db/dbchangelog.xml
  jpa:
    open-in-view: false
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 10s
    scheduling:
      pool:
        size: 4
  cache:
    cache-names: urls
    redis:
      enable-statistics: true
  data:
    redis:
      host: redis.hrvalabs.net
      timeout: 3s
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        serialization-mode: via-dto
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID:}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:}
            scope: profile, email
            redirect-uri: https://hrva.cc/login/oauth2/code/google
  web:
    error:
      include-message: always
  ai:
    mcp:
      server:
        name: hrva.cc
        protocol: STATELESS
        capabilities:
          resource: true
          prompt: true
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

logging:
  level:
    io.modelcontextprotocol: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,env,beans
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true
        secure: true

app:
  app-name: hrva.cc Url Shortener
  google-api:
    client-id: hrva.cc
    client-version: 1.0.0
  github-sign-in:
    client-id: ${OAUTH2_GITHUB_CLIENT_ID:}
    client-secret: ${OAUTH2_GITHUB_CLIENT_SECRET:}
    scope: user:email
    redirect-uri: https://hrva.cc/login/oauth2/code/github
  short-url-length: 5
  api-key-calls-limit: 256
  jwt-token-validity-seconds: 36000
  api-key-expiration-in-months: 12
  reset-token-expiration-in-hours: 24
  user-api-key-slots: 4
  ip-retention-duration-in-hours: 48
  deactivate-user-account-after-days: 1825
  max-login-attempts: 20
  url-expiration-notification-hours: 24
  registration-enabled: true
  anonymous-url-creation-enabled: false
  spamhaus-dqs-key: ${SPAMHAUS_DQS_KEY:}
  discord-webhook-url: ${DISCORD_WEBHOOK_URL:}
  mcp:
    issuer: https://hrva.cc
  analytics:
    zone: ${APP_ANALYTICS_ZONE:Europe/Zagreb}
  digest:
    weekly:
      enabled: true
      email: true
  burst:
    links: 5
    window: 1h
  campaign:
    enabled: ${APP_CAMPAIGN_ENABLED:true}
    links: ${APP_CAMPAIGN_LINKS:3}
    domains: ${APP_CAMPAIGN_DOMAINS:3}
    window: ${APP_CAMPAIGN_WINDOW:24h}
  traffic-alerts:
    enabled: ${APP_TRAFFIC_ALERTS_ENABLED:true}
    link-clicks: 25
    share-percent: 50
    min-anonymous-clicks: 100
  retention:
    email-log-days: 90
    audit-log-months: 12
  passkeys:
    rp-id: hrva.cc
    allowed-origins: https://app.hrva.cc
  notifications:
    key: ${APP_NOTIFICATIONS_KEY:}
  destination-check:
    enabled: ${APP_DESTINATION_CHECK_ENABLED:true}
    catch-up-on-startup: ${APP_DESTINATION_CHECK_CATCH_UP_ON_STARTUP:true}
    budget: ${APP_DESTINATION_CHECK_BUDGET:2h}
  domains:
    enabled: ${APP_DOMAINS_ENABLED:true}
    max-active: ${APP_DOMAINS_MAX_ACTIVE:90}
    free-allowance: ${APP_DOMAINS_FREE_ALLOWANCE:100}
    per-user: ${APP_DOMAINS_PER_USER:1}
    reserved: ${APP_DOMAINS_RESERVED:hrva.cc,hrvalabs.net}
    primary-hosts: ${APP_DOMAINS_PRIMARY_HOSTS:hrva.cc,domains.hrva.cc}
    ignored-hostnames: ${APP_DOMAINS_IGNORED_HOSTNAMES:test.karlo.cc}
    cname-target: ${APP_DOMAINS_CNAME_TARGET:domains.hrva.cc}
  cloudflare:
    api-token: ${CLOUDFLARE_API_TOKEN:}
    zone-id: ${CLOUDFLARE_ZONE_ID:}
    api-base: ${APP_CLOUDFLARE_API_BASE:https://api.cloudflare.com/client/v4}
