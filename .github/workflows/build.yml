name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            maven-args: ''
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            maven-args: '-DskipTests'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package ${{ matrix.maven-args }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set image name and platform pair
        id: image
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image and push it by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.image.outputs.name }}
          outputs: ${{ github.event_name == 'push' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}

      - name: Export the digest
        if: github.event_name == 'push'
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ "$DIGEST" != sha256:* ]]; then
            echo "::error::The build returned no digest"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ steps.image.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          digests=(*)
          if (( ${#digests[@]} != 2 )); then
            echo "::error::Expected 2 platform digests, found ${#digests[@]}: ${digests[*]}"
            exit 1
          fi
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:latest" --tag "$IMAGE:$SHA" "${sources[@]}"

      - name: Inspect the manifest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$SHA"
          platforms=$(docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(",")')
          if [[ "$platforms" != "linux/amd64,linux/arm64" ]]; then
            echo "::error::$IMAGE:$SHA lists platforms '$platforms', expected linux/amd64,linux/arm64"
            exit 1
          fi
          echo "$IMAGE:$SHA and :latest list $platforms"

      - name: Redeploy on Portainer
        id: redeploy
        if: github.event_name == 'push'
        shell: bash
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "::notice::PORTAINER_WEBHOOK_URL is not set, skipping the redeploy"
            exit 0
          fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 3 --retry-all-errors --max-time 30 -X POST \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$PORTAINER_WEBHOOK_URL")
          if [[ "$status" != 2* ]]; then
            echo "::error::Portainer webhook answered HTTP $status"
            exit 1
          fi
          echo "Portainer redeploy triggered (HTTP $status)"
          echo "triggered=true" >> "$GITHUB_OUTPUT"

      - name: Smoke test the deploy
        if: success() && github.event_name == 'push' && steps.redeploy.outputs.triggered == 'true'
        shell: bash
        env:
          SITE: https://hrva.cc
          PROBE_LINK: revolut
        run: |
          set -euo pipefail
          expected=$(jq -r '.releases[0].version' src/main/resources/changelog.json)
          deadline=$((SECONDS + 300))

          until [[ "$(curl --silent --max-time 10 "$SITE/actuator/health/readiness" | jq -r '.status' 2>/dev/null)" == "UP" ]]; do
            if (( SECONDS >= deadline )); then
              echo "::error::$SITE/actuator/health/readiness wasn't UP within 5 minutes"
              exit 1
            fi
            sleep 10
          done
          echo "Readiness is UP"

          until [[ "$(curl --silent --max-time 10 "$SITE/api/changelog" | jq -r '.releases[0].version' 2>/dev/null)" == "$expected" ]]; do
            if (( SECONDS >= deadline )); then
              echo "::error::$SITE/api/changelog didn't show $expected within 5 minutes"
              exit 1
            fi
            sleep 10
          done
          echo "The changelog shows $expected"

          read -r status location < <(curl --silent --max-time 10 --head --output /dev/null --write-out '%{http_code} %{redirect_url}\n' "$SITE/$PROBE_LINK")
          if [[ "$status" != 302 || -z "$location" || "$location" == "$SITE"* ]]; then
            echo "::error::HEAD $SITE/$PROBE_LINK answered $status ${location:-without a Location}, expected a 302 to its destination"
            exit 1
          fi
          echo "HEAD /$PROBE_LINK redirects (HTTP $status)"
