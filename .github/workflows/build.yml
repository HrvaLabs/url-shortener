name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: Redeploy on Portainer
        id: redeploy
        if: github.event_name == 'push'
        shell: bash
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "::notice::PORTAINER_WEBHOOK_URL is not set, skipping the redeploy"
            exit 0
          fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 3 --retry-all-errors --max-time 30 -X POST \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$PORTAINER_WEBHOOK_URL")
          if [[ "$status" != 2* ]]; then
            echo "::error::Portainer webhook answered HTTP $status"
            exit 1
          fi
          echo "Portainer redeploy triggered (HTTP $status)"
          echo "triggered=true" >> "$GITHUB_OUTPUT"

      - name: Smoke test the deploy
        if: success() && github.event_name == 'push' && steps.redeploy.outputs.triggered == 'true'
        shell: bash
        env:
          SITE: https://hrva.cc
          PROBE_LINK: revolut
        run: |
          set -euo pipefail
          expected=$(jq -r '.releases[0].version' src/main/resources/changelog.json)
          deadline=$((SECONDS + 300))

          until [[ "$(curl --silent --max-time 10 "$SITE/actuator/health/readiness" | jq -r '.status' 2>/dev/null)" == "UP" ]]; do
            if (( SECONDS >= deadline )); then
              echo "::error::$SITE/actuator/health/readiness wasn't UP within 5 minutes"
              exit 1
            fi
            sleep 10
          done
          echo "Readiness is UP"

          until [[ "$(curl --silent --max-time 10 "$SITE/api/changelog" | jq -r '.releases[0].version' 2>/dev/null)" == "$expected" ]]; do
            if (( SECONDS >= deadline )); then
              echo "::error::$SITE/api/changelog didn't show $expected within 5 minutes"
              exit 1
            fi
            sleep 10
          done
          echo "The changelog shows $expected"

          read -r status location < <(curl --silent --max-time 10 --head --output /dev/null --write-out '%{http_code} %{redirect_url}\n' "$SITE/$PROBE_LINK")
          if [[ "$status" != 302 || -z "$location" || "$location" == "$SITE"* ]]; then
            echo "::error::HEAD $SITE/$PROBE_LINK answered $status ${location:-without a Location}, expected a 302 to its destination"
            exit 1
          fi
          echo "HEAD /$PROBE_LINK redirects (HTTP $status)"
